name: overnight-nap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  nap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run nap -- --inbox inbox --out out
      - uses: actions/upload-artifact@v4
        with:
          name: morning-brief
          path: out/
